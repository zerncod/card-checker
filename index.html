<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoMining Eligibility</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161c2d;
            --text-main: #ffffff;
            --text-dim: #a0a6b5;
            --accent: #8c5dff;
            --success: #28c76f;
            --error: #ea5455;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Контейнер для слайдов */
        .quiz-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Общий стиль карточки */
        .step {
            position: absolute;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid #232d43;
            border-radius: 16px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateX(100px);
            pointer-events: none;
        }

        /* Активный шаг */
        .step.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }

        /* Уходящий шаг (влево) */
        .step.exit {
            opacity: 0;
            transform: translateX(-100px);
        }

        label { display: block; font-weight: 600; margin-bottom: 20px; font-size: 18px; text-align: center; }

        select {
            width: 100%;
            padding: 14px;
            border: 2px solid #232d43;
            border-radius: 10px;
            background-color: #0f131f;
            color: #fff;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus { border-color: var(--accent); }

        .result-box {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            line-height: 1.6;
            font-size: 15px;
        }

        .eligible { background: rgba(40, 199, 111, 0.1); border: 1px solid var(--success); color: var(--success); }
        .not-eligible { background: rgba(234, 84, 85, 0.1); border: 1px solid var(--error); color: var(--error); }
        
        .btn-reset {
            margin-top: 20px;
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="step1" class="step active">
        <label>What is your citizenship?</label>
        <select id="citizenship" onchange="nextStep('step1', 'citizenship')">
            <option value="">Select...</option>
            <option value="germany">Germany</option>
            <option value="ru">Russia</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div id="step2" class="step">
        <label>Do you have EEA+ residence?</label>
        <select id="residence" onchange="nextStep('step2', 'residence')">
            <option value="">Select...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="step3" class="step">
        <label>Passed KYC Level 1 with RU passport?</label>
        <select id="kyc" onchange="nextStep('step3', 'kyc')">
            <option value="">Select...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="step-result" class="step">
        <div id="result-content" class="result-box"></div>
        <button class="btn-reset" onclick="resetQuiz()">← Start over</button>
    </div>
</div>

<script>
    function nextStep(currentId, type) {
        const val = document.getElementById(type).value;
        if (!val) return;

        const current = document.getElementById(currentId);
        
        // Логика переходов
        if (type === 'citizenship') {
            if (val === 'germany') {
                showFinal("<b>Eligible!</b> As a German citizen, you can apply immediately.", true);
            } else if (val === 'other') {
                showFinal("<b>Eligible!</b> Please follow the standard application flow.", true);
            } else if (val === 'ru') {
                goTo('step1', 'step2');
            }
        } 
        else if (type === 'residence') {
            if (val === 'no') {
                showFinal("<b>Not Eligible.</b> RU citizens must have EEA+ residence to apply.", false);
            } else {
                goTo('step2', 'step3');
            }
        }
        else if (type === 'kyc') {
            if (val === 'yes') {
                showFinal("<b>Action required:</b> Contact support to re-verify your KYC with EEA documents.", true);
            } else {
                showFinal("<b>Eligible!</b> Complete both KYC levels using your EEA document.", true);
            }
        }
    }

    function goTo(fromId, toId) {
        const from = document.getElementById(fromId);
        const to = document.getElementById(toId);
        
        from.classList.remove('active');
        from.classList.add('exit');
        
        setTimeout(() => {
            to.classList.add('active');
        }, 100);
    }

    function showFinal(text, isEligible) {
        const resBox = document.getElementById('result-content');
        resBox.innerHTML = text;
        resBox.className = 'result-box ' + (isEligible ? 'eligible' : 'not-eligible');
        
        // Находим текущий активный шаг, чтобы уйти с него
        const activeStep = document.querySelector('.step.active');
        goTo(activeStep.id, 'step-result');
    }

    function resetQuiz() {
        location.reload();
    }
</script>

</body>
</html>
