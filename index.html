<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoMining Eligibility Checker</title>
    <style>
        :root {
            --bg-page: #060a13; /* Глубокий темный фон */
            --bg-card: #111726; /* Фон карточки как на скрине */
            --accent-light: #c4a8ee; /* Твой цвет */
            --accent-main: #8f42f3;  /* Твой цвет */
            --text-white: #ffffff;
            --text-dim: #a0a6b5;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-page);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Контейнер для фиксации размера и центрирования */
        .quiz-view {
            position: relative;
            width: 100%;
            max-width: 520px; /* Чуть шире, как ты просил */
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Стиль каждого шага */
        .step {
            position: absolute;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid #232d43;
            border-radius: 20px;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateX(120px); /* Появление справа */
            pointer-events: none;
        }

        .step.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }

        .step.exit {
            opacity: 0;
            transform: translateX(-120px); /* Уход влево */
        }

        h2 {
            color: var(--text-white);
            font-size: 22px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 16px;
            border: 2px solid #232d43;
            border-radius: 12px;
            background-color: #0c111d;
            color: #fff;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 18px;
        }

        /* Твои фирменные цвета при фокусе */
        select:focus { 
            border-color: var(--accent-main);
            box-shadow: 0 0 10px rgba(143, 66, 243, 0.3);
        }

        /* Финальные блоки */
        .result-msg {
            text-align: center;
            line-height: 1.6;
            font-size: 16px;
            padding: 20px;
            border-radius: 12px;
        }

        .eligible { 
            background: linear-gradient(135deg, rgba(143, 66, 243, 0.1) 0%, rgba(196, 168, 238, 0.1) 100%);
            border: 1px solid var(--accent-light);
            color: var(--accent-light);
        }

        .not-eligible { 
            background: rgba(234, 84, 85, 0.1); 
            border: 1px solid #ea5455; 
            color: #ea5455; 
        }

        .btn-restart {
            display: block;
            margin: 25px auto 0;
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-dim);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-restart:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

<div class="quiz-view">
    <div id="q1" class="step active">
        <h2>What is your citizenship?</h2>
        <select id="citizenship" onchange="handleSelect('q1', 'citizenship')">
            <option value="">Select...</option>
            <option value="germany">Germany</option>
            <option value="ru">Russia</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div id="q2" class="step">
        <h2>Do you have EEA+ residence?</h2>
        <select id="residence" onchange="handleSelect('q2', 'residence')">
            <option value="">Select...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="q3" class="step">
        <h2>Passed KYC Level 1 with RU passport?</h2>
        <select id="kyc" onchange="handleSelect('q3', 'kyc')">
            <option value="">Select...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="q-result" class="step">
        <div id="res-box" class="result-msg"></div>
        <button class="btn-restart" onclick="location.reload()">← Start over</button>
    </div>
</div>

<script>
    function handleSelect(currentStepId, type) {
        const val = document.getElementById(type).value;
        if (!val) return;

        // ЛОГИКА ПЕРЕХОДОВ
        if (type === 'citizenship') {
            if (val === 'germany') showFinal("<b>Eligible!</b> As a German citizen, you can apply for a GoMining card immediately.", true);
            else if (val === 'other') showFinal("<b>Eligible!</b> Please follow the standard application flow.", true);
            else if (val === 'ru') move('q1', 'q2');
        } 
        else if (type === 'residence') {
            if (val === 'no') showFinal("<b>Not Eligible.</b> RU citizens must have a valid EEA+ residence permit to apply.", false);
            else move('q2', 'q3');
        }
        else if (type === 'kyc') {
            if (val === 'yes') showFinal("<b>Action required:</b> Since you passed KYC 1 with a RU passport, contact support to re-verify with your EEA documents.", true);
            else showFinal("<b>Eligible!</b> You can apply. Ensure you complete both KYC levels using your EEA residence document.", true);
        }
    }

    function move(from, to) {
        const f = document.getElementById(from);
        const t = document.getElementById(to);
        f.classList.remove('active');
        f.classList.add('exit');
        setTimeout(() => { t.classList.add('active'); }, 150);
    }

    function showFinal(text, ok) {
        const box = document.getElementById('res-box');
        box.innerHTML = text;
        box.className = 'result-msg ' + (ok ? 'eligible' : 'not-eligible');
        
        const active = document.querySelector('.step.active');
        move(active.id, 'q-result');
    }
</script>

</body>
</html>
