<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eligibility Checker</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: white; margin: 0; padding: 10px; color: #24292e; }
        .container { max-width: 100%; margin: 0 auto; border: 1px solid #e1e4e8; padding: 15px; border-radius: 8px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; }
        select { width: 100%; padding: 8px; border: 1px solid #d1d5da; border-radius: 6px; background-color: #fafbfc; margin-bottom: 15px; font-size: 13px; outline: none; }
        .result { padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.4; display: none; margin-top: 10px; }
        .eligible { background-color: #dafbe1; border: 1px solid #bbe5c5; color: #1a7f37; }
        .not-eligible { background-color: #ffebe9; border: 1px solid #ffc1c0; color: #cf222e; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1">
        <label>1. Select your citizenship:</label>
        <select id="citizenship" onchange="updateFlow()">
            <option value="">Choose...</option>
            <option value="germany">Germany</option>
            <option value="ru">Russia</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div id="step2" class="hidden">
        <label>2. Do you have EEA+ residence?</label>
        <select id="residence" onchange="updateFlow()">
            <option value="">Choose...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="step3" class="hidden">
        <label>3. Passed KYC Level 1 with RU passport?</label>
        <select id="kyc" onchange="updateFlow()">
            <option value="">Choose...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="result" class="result"></div>
</div>

<script>
    function updateFlow() {
        const c = document.getElementById('citizenship').value;
        const r = document.getElementById('residence');
        const k = document.getElementById('kyc');
        const res = document.getElementById('result');
        
        // Скрываем шаги и результат при каждом изменении
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.add('hidden');
        res.style.display = 'none';

        if (c === 'germany') {
            showResult("<b>Eligible!</b> As a German citizen, you can apply for the card immediately.", true);
        } else if (c === 'other') {
            showResult("<b>Eligible!</b> Please follow the standard application flow for your region.", true);
        } else if (c === 'ru') {
            document.getElementById('step2').classList.remove('hidden');
            if (r.value === 'no') {
                showResult("<b>Not Eligible.</b> Russian citizens must have EEA+ residence to apply.", false);
            } else if (r.value === 'yes') {
                document.getElementById('step3').classList.remove('hidden');
                if (k.value === 'yes') {
                    showResult("<b>Eligible (Action required):</b> Since you have already passed KYC Level 1 with a Russian passport, please <b>contact our support team</b> to re-verify your account using your EEA residence document.", true);
                } else if (k.value === 'no') {
                    showResult("<b>Eligible!</b> You can apply, but you must complete <b>both KYC Level 1 and Level 2</b> using your EEA residence document (not your RU passport).", true);
                }
            }
        }
    }

    function showResult(text, isEligible) {
        const res = document.getElementById('result');
        res.innerHTML = text;
        res.style.display = 'block';
        res.className = isEligible ? 'result eligible' : 'result not-eligible';
    }
</script>

</body>
</html>
