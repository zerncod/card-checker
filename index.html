<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eligibility Checker</title>
    <style>
        /* Центрируем виджет и задаем фон страницы */
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: #f6f8fa; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding-top: 50px;
        }

        /* Стиль самого окна (карточки) */
        .container { 
            width: 100%;
            max-width: 450px; 
            background: white;
            border: 1px solid #d0d7de; 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(149,157,165,0.2);
        }

        label { display: block; font-weight: 600; margin-bottom: 10px; font-size: 14px; color: #1f2328; }
        
        select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #d0d7de; 
            border-radius: 6px; 
            background-color: #ffffff; 
            margin-bottom: 20px; 
            font-size: 14px; 
            cursor: pointer;
            outline: none;
        }

        select:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,0.3); }

        .result { padding: 16px; border-radius: 6px; font-size: 14px; line-height: 1.5; display: none; margin-top: 10px; }
        .eligible { background-color: #dafbe1; border: 1px solid #bbe5c5; color: #1a7f37; }
        .not-eligible { background-color: #ffebe9; border: 1px solid #ffc1c0; color: #cf222e; }
        .hidden { display: none; }
        
        b { color: inherit; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1">
        <label>1. Select your citizenship:</label>
        <select id="citizenship" onchange="updateFlow()">
            <option value="">Choose...</option>
            <option value="germany">Germany</option>
            <option value="ru">Russia</option>
            <option value="other">Other</option>
        </select>
    </div>

    <div id="step2" class="hidden">
        <label>2. Do you have EEA+ residence?</label>
        <select id="residence" onchange="updateFlow()">
            <option value="">Choose...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="step3" class="hidden">
        <label>3. Passed KYC Level 1 with RU passport?</label>
        <select id="kyc" onchange="updateFlow()">
            <option value="">Choose...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="result" class="result"></div>
</div>

<script>
    function updateFlow() {
        const c = document.getElementById('citizenship').value;
        const r = document.getElementById('residence');
        const k = document.getElementById('kyc');
        const res = document.getElementById('result');
        
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.add('hidden');
        res.style.display = 'none';

        if (c === 'germany') {
            showResult("<b>Eligible!</b> As a German citizen, you can apply for the card immediately.", true);
        } else if (c === 'other') {
            showResult("<b>Eligible!</b> Please follow the standard application flow for your region.", true);
        } else if (c === 'ru') {
            document.getElementById('step2').classList.remove('hidden');
            if (r.value === 'no') {
                showResult("<b>Not Eligible.</b> Russian citizens must have EEA+ residence to apply.", false);
            } else if (r.value === 'yes') {
                document.getElementById('step3').classList.remove('hidden');
                if (k.value === 'yes') {
                    showResult("<b>Eligible (Action required):</b> Since you have already passed KYC Level 1 with a RU passport, please <b>contact support</b> to re-verify with your EEA residence document.", true);
                } else if (k.value === 'no') {
                    showResult("<b>Eligible!</b> Complete <b>both KYC Level 1 and 2</b> using your EEA residence document.", true);
                }
            }
        }
    }

    function showResult(text, isEligible) {
        const res = document.getElementById('result');
        res.innerHTML = text;
        res.style.display = 'block';
        res.className = isEligible ? 'result eligible' : 'result not-eligible';
    }
</script>

</body>
</html>
