<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoMining Eligibility Checker</title>
    <style>
        :root {
            --bg-page: #060a13;
            --bg-card: #111726;
            --accent: #8f42f3;
            --accent-soft: #c4a8ee;
            --success: #28c76f;
            --error: #ea5455;
            --text-white: #ffffff;
            --text-gray: #a0a6b5;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-white);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер с фиксированной высотой, чтобы не было "прыжков" */
        .quiz-view {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 480px; /* Увеличил, чтобы не было тесно */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .step {
            position: absolute;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid #232d43;
            border-radius: 24px;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateX(100px);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }

        .step.exit {
            opacity: 0;
            transform: translateX(-100px);
        }

        h2 {
            font-size: 22px;
            margin: 0 0 10px 0;
            text-align: center;
            font-weight: 600;
            line-height: 1.4;
        }

        select {
            width: 100%;
            padding: 16px;
            border: 2px solid #232d43;
            border-radius: 14px;
            background-color: #0c111d;
            color: #fff;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 20px center;
            background-size: 16px;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(143, 66, 243, 0.1);
        }

        .result-msg {
            text-align: center;
            line-height: 1.6;
            font-size: 17px;
            padding: 25px;
            border-radius: 16px;
            font-weight: 500;
        }

        .eligible { background: rgba(40, 199, 111, 0.1); border: 1px solid var(--success); color: var(--success); }
        .action-required { background: rgba(143, 66, 243, 0.1); border: 1px solid var(--accent); color: var(--accent-soft); }
        .not-eligible { background: rgba(234, 84, 85, 0.1); border: 1px solid var(--error); color: var(--error); }

        .btn-restart {
            margin-top: 10px;
            background: transparent;
            border: 1px solid #333c4d;
            color: var(--text-gray);
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            align-self: center;
            transition: all 0.2s;
        }

        .btn-restart:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

<div class="quiz-view">
    <div id="q1" class="step active">
        <h2>What is your citizenship?</h2>
        <select id="country" onchange="next('q1')">
            <option value="">Select country...</option>
        </select>
    </div>

    <div id="q_res" class="step">
        <h2>Do you have a valid EEA+ residence permit?</h2>
        <select id="res" onchange="next('q_res')">
            <option value="">Select...</option>
            <option value="yes">Yes, I live in EEA+</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="q_doc" class="step">
        <h2>Do you have a valid National Passport or ID card?</h2>
        <select id="doc" onchange="next('q_doc')">
            <option value="">Select...</option>
            <option value="yes">Yes, I have</option>
            <option value="no">No / Only Driver's License</option>
        </select>
    </div>

    <div id="q_kyc" class="step">
        <h2>Have you already passed KYC 1 with your national document?</h2>
        <select id="kyc" onchange="next('q_kyc')">
            <option value="">Select...</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div id="q_final" class="step">
        <div id="res-box" class="result-msg"></div>
        <button class="btn-restart" onclick="location.reload()">← Start over</button>
    </div>
</div>

<script>
    const prohibited = ["AFG", "BLR", "BDI", "CAF", "COG", "COD", "CUB", "GINE", "GNB", "IRN", "IRQ", "LBN", "LBY", "MLI", "MMR", "PRK", "SOM", "SSD", "SDN", "SYR", "VEN", "YEM", "ZWE", "RUS"];

    const countries = [
        {c:"AFG", n:"Afghanistan"}, {c:"ALB", n:"Albania"}, {c:"DZA", n:"Algeria"}, {c:"AND", n:"Andorra"}, {c:"AGO", n:"Angola"}, {c:"ARG", n:"Argentina"}, {c:"ARM", n:"Armenia"}, {c:"AUS", n:"Australia"}, {c:"AUT", n:"Austria"}, {c:"AZE", n:"Azerbaijan"}, {c:"BEL", n:"Belgium"}, {c:"BLR", n:"Belarus"}, {c:"BRA", n:"Brazil"}, {c:"BGR", n:"Bulgaria"}, {c:"CAN", n:"Canada"}, {c:"CHL", n:"Chile"}, {c:"CHN", n:"China"}, {c:"COL", n:"Colombia"}, {c:"HRV", n:"Croatia"}, {c:"CYP", n:"Cyprus"}, {c:"CZE", n:"Czech Republic"}, {c:"DNK", n:"Denmark"}, {c:"EST", n:"Estonia"}, {c:"FIN", n:"Finland"}, {c:"FRA", n:"France"}, {c:"DEU", n:"Germany"}, {c:"GRC", n:"Greece"}, {c:"HUN", n:"Hungary"}, {c:"ISL", n:"Iceland"}, {c:"IND", n:"India"}, {c:"IDN", n:"Indonesia"}, {c:"IRL", n:"Ireland"}, {c:"ISR", n:"Israel"}, {c:"ITA", n:"Italy"}, {c:"JPN", n:"Japan"}, {c:"KAZ", n:"Kazakhstan"}, {c:"KOR", n:"South Korea"}, {c:"LVA", n:"Latvia"}, {c:"LTU", n:"Lithuania"}, {c:"LUX", n:"Luxembourg"}, {c:"MLT", n:"Malta"}, {c:"MEX", n:"Mexico"}, {c:"NLD", n:"Netherlands"}, {c:"NOR", n:"Norway"}, {c:"POL", n:"Poland"}, {c:"PRT", n:"Portugal"}, {c:"ROU", n:"Romania"}, {c:"RUS", n:"Russian Federation"}, {c:"SRB", n:"Serbia"}, {c:"SGP", n:"Singapore"}, {c:"SVK", n:"Slovakia"}, {c:"SVN", n:"Slovenia"}, {c:"ESP", n:"Spain"}, {c:"SWE", n:"Sweden"}, {c:"CHE", n:"Switzerland"}, {c:"THA", n:"Thailand"}, {c:"TUR", n:"Turkey"}, {c:"ARE", n:"UAE"}, {c:"GBR", n:"United Kingdom"}, {c:"UZB", n:"Uzbekistan"}, {c:"VNM", n:"Vietnam"}
    ].sort((a,b) => a.n.localeCompare(b.n));

    const selectEl = document.getElementById('country');
    countries.forEach(item => {
        let opt = document.createElement('option');
        opt.value = item.c;
        opt.textContent = item.n;
        selectEl.appendChild(opt);
    });

    function move(from, to) {
        document.getElementById(from).classList.remove('active');
        document.getElementById(from).classList.add('exit');
        setTimeout(() => { document.getElementById(to).classList.add('active'); }, 150);
    }

    function finish(text, status) {
        const box = document.getElementById('res-box');
        box.innerHTML = text;
        box.className = 'result-msg ' + status;
        const currentActive = document.querySelector('.step.active');
        move(currentActive.id, 'q_final');
    }

    function next(step) {
        const countryVal = document.getElementById('country').value;
        
        if (step === 'q1') {
            if (prohibited.includes(countryVal)) {
                move('q1', 'q_res');
            } else {
                move('q1', 'q_doc');
            }
        } 
        else if (step === 'q_res') {
            const resVal = document.getElementById('res').value;
            if (resVal === 'no') {
                finish("<b>Not Eligible.</b> Citizens of restricted jurisdictions must have an EEA+ residence permit to apply.", "not-eligible");
            } else if (resVal === 'yes') {
                move('q_res', 'q_kyc');
            }
        }
        else if (step === 'q_doc') {
            const docVal = document.getElementById('doc').value;
            if (docVal === 'no') {
                finish("<b>Action Required:</b> A driver's license is not accepted. Please provide a valid National Passport or ID card.", "action-required");
            } else if (docVal === 'yes') {
                finish("<b>Eligible!</b> You can proceed with the application using your national document.", "eligible");
            }
        }
        else if (step === 'q_kyc') {
            const kycVal = document.getElementById('kyc').value;
            if (kycVal === 'yes') {
                finish("<b>Action Required:</b> Since you have an existing KYC with a restricted document, please contact support to update your profile.", "action-required");
            } else if (kycVal === 'no') {
                finish("<b>Eligible!</b> You can apply. Ensure you use your EEA residence permit for both KYC levels.", "eligible");
            }
        }
    }
</script>

</body>
</html>
